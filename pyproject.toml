[project]
name = "potehinson_sound_core"
version = "0.2.4"
description = ""
authors = [
    {name = "Uto4ka", email = "alezhestkov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14, <4"
dependencies = [
    "python-dotenv>=1.2.3,<2.0.0",
    "potehinsonnet @ git+https://github.com/uto4e4ka/poteninson_net.git@dev",
    "yandex-music @ git+https://github.com/MarshalX/yandex-music-api.git@main",
    "mutagen>=1.48.1,<2.0.0",
    "pillow (>=12.3.0,<13.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "aiohttp (>=3.14.3,<4)",
    "edge-tts (>=7.2.8,<8)",
    "fastapi (>=0.141.1,<0.142)",
    "uvicorn (>=0.52.4,<0.53)",
]

[tool.poetry]
packages = [{ include = "potehinson_sound_core" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["potehinson_sound_core"]
omit = [".venv/*", "tests/*"]
